<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rize — Smarter placement management. Connect students, companies, and opportunities in one intelligent platform." />
    <meta name="theme-color" content="#09090B" />

    <!-- Anti-FOUC: apply saved theme before first paint -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem('rize-theme') || '{}');
        var theme = saved.state && saved.state.theme ? saved.state.theme : 'solarized';
        document.documentElement.setAttribute('data-theme', theme);
      } catch(e) {
        document.documentElement.setAttribute('data-theme', 'solarized');
      }
    </script>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <title>Rize — Smarter Placement Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
